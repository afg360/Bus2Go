plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp' //we can use with Room
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'app.bus2go.android'
    compileSdk 34
    
    defaultConfig {
        applicationId "app.bus2go.android"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.3.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas")
        }
    }
    
    flavorDimensions += [ "distribution" ]
    productFlavors {
        fdroid {
            isDefault true
            dimension "distribution"
            applicationIdSuffix ".fdroid"
        }
        indep {
            dimension "distribution"
            applicationIdSuffix ".indep"
        }
    }
    
    //include properties defined locally
    def localProperties = new Properties()
    localProperties.load(new FileInputStream(rootProject.file("local.properties")))
    
    signingConfigs {
        def bus2goStoreFile = rootProject.file("bus2go.pkcs12")
        def bus2goStoreFilePassword = localProperties.getProperty("STORE_PASSWORD")
        
        release {
            storeFile bus2goStoreFile
            storePassword bus2goStoreFilePassword
            keyAlias localProperties.getProperty("KEY_RELEASE")
            keyPassword localProperties.getProperty("KEY_RELEASE_PASSWORD")
        }
    }
    
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
        
        release {
            java.srcDirs 'src/release/kotlin'
        }
    }
    
    dependenciesInfo {
        // Disables dependency metadata when building APKs (for IzzyOnDroid/F-Droid)
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles (for Google Play)
        includeInBundle = false
    }
    
    buildTypes {
        debug {
            isDefault true
            debuggable true
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            android.buildFeatures.buildConfig true
            buildConfigField "String", "LOCAL_HOST", "\"${localProperties.getProperty('LOCAL_HOST', '127.0.0.1')}\""
            buildConfigField "int", "DEFAULT_PORT", "${localProperties.getProperty('DEFAULT_PORT', '8000')}"
        }
        
        release {
            versionNameSuffix "-alpha" //TODO can be removed when upgrading to a fully non alpha version
            debuggable false
            minifyEnabled true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        
        applicationVariants.all { variant ->
            variant.outputs.all { output ->
                def appName = "bus2go"
                def flavor = variant.flavorName ? "-${variant.flavorName}" : ""
                def buildType = (variant.buildType.name != "release") ? "-${variant.buildType.name}" : ""
                def versionName = variant.versionName
                
                outputFileName = "${appName}${flavor}${buildType}-v${versionName}.apk"
            }
        }
        
    }
    
    //TODO add lint option to fail build if unused imports ONLY FOR RELEASE BUILDS
    lint {
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }
    
    buildFeatures {
        viewBinding true
    }
}


dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    def fragment_version = "1.6.2"
    // Java language implementation
    //noinspection GradleDependency
    implementation "androidx.fragment:fragment-ktx:$fragment_version"
    implementation "androidx.core:core-ktx:1.13.1"
    
    def kotlin_coroutines_version = "1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlin_coroutines_version"

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.core:core-splashscreen:1.0.1"

    //WorkManager
    def work_version = "2.9.1"
    implementation "androidx.work:work-runtime-ktx:$work_version"
    
    def data_store_version = "1.1.1"
    //DataStore
    implementation "androidx.datastore:datastore-preferences:$data_store_version"
    //proto datastore
    implementation "androidx.datastore:datastore:$data_store_version"

    //kotlin serializable
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.5"


    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"

    // To use Kotlin annotation processing tool (kapt)
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"

    /* WebRequest apis */
    // Ktor Core
    def ktor_version = "2.0.3"
    implementation "io.ktor:ktor-client-core:$ktor_version"
    implementation "io.ktor:ktor-client-websockets:$ktor_version"

    // Ktor HTTP client dependencies
    implementation "io.ktor:ktor-client-okhttp:$ktor_version"
    
    def mockWebServer_version = "1.2.1"
    //Unit Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$kotlin_coroutines_version"
    testImplementation "org.assertj:assertj-core:3.24.2"
    testImplementation "androidx.test:core:1.6.1"
    testImplementation "androidx.arch.core:core-testing:2.2.0"
    testImplementation "androidx.room:room-testing:$room_version"
    testImplementation "androidx.work:work-testing:$work_version"
    testImplementation "com.squareup.okhttp:mockwebserver:$mockWebServer_version"
    
    //Instrumentation Testing
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation "androidx.work:work-testing:$work_version"
    androidTestImplementation "com.squareup.okhttp:mockwebserver:$mockWebServer_version"
}
